services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - DATA_PATH=/app/data/wordss.sqlite
    volumes:
      - wordss-data:/app/data
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://localhost:3001').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  wordss-data:
