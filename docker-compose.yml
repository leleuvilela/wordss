services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wordss-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATA_PATH=/app/data/wordss.sqlite
    volumes:
      - wordss-data:/app/data
    networks:
      - wordss-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://localhost:3001').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wordss-web
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - wordss-network
    restart: unless-stopped

networks:
  wordss-network:
    driver: bridge

volumes:
  wordss-data:
